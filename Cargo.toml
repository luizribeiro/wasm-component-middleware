[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/wasm-component-middleware"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
wasmtime = { version = "49", default-features = false, features = [
  "async",
  "component-model",
  "runtime",
] }
wasmtime-wasi = "49"
wasmtime-wasi-http = "49"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"
